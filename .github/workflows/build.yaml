name: Build llama.cpp for Snapdragon Hexagon NPU (Android)

on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: 'llama.cpp branch, tag, or commit SHA'
        required: false
        default: 'master'
      hexagon_arch:
        description: 'Hexagon architecture(s) to build for, separated by semicolons'
        required: false
        default: 'v73;v75'

jobs:
  build:
    runs-on: ubuntu-latest
    # container:
    #   image: ghcr.io/snapdragon-toolchain/arm64-android:v0.8
    #   options: --platform linux/amd64

    steps:
      - name: Test vars
        run: |
          echo "LLAMA_REF=${{ inputs.llama_ref }}"
